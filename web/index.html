<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1116">
<meta name="mobile-web-app-capable" content="yes">
<title>Agent 学习监督</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0e1116;color:#e6edf3;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;
  background:#1f2933;color:#7ee2b8;padding:1px 5px;border-radius:5px;word-break:break-word}
.hdr{padding:calc(14px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,#0e1116 78%,rgba(14,17,22,.86));border-bottom:1px solid #1c2430}
.hdr-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hdr h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
.hdr .sub{font-size:12px;color:#8b98a5;margin-top:2px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#1b2733;color:#8ad;border:1px solid #24344a}
.badge.ok{background:#12301f;color:#3ddc97;border-color:#1e4d33}
.badge.warn{background:#3a2410;color:#ffb020;border-color:#5a3a17}
.badge.red{background:#3a1414;color:#ff6b6b;border-color:#5a2020}
.badge.dim{background:#151b23;color:#6c7a88;border-color:#1e2733}
main{padding:16px 18px 28px;max-width:960px;margin:0 auto}
.card{background:#151b23;border:1px solid #1e2733;border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:13px;margin:0 0 10px;color:#8b98a5;font-weight:600;letter-spacing:.4px}
.bar{height:8px;background:#26323f;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2f9e6d,#3ddc97);border-radius:99px;transition:width .3s}
.bar.blue>i{background:linear-gradient(90deg,#2b6cb0,#4a9eff)}
.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid #1a222c}
.row:last-child{border-bottom:0}
.row .txt{flex:1;min-width:0}
.row .t1{font-size:14.5px}
.row .t2{font-size:11.5px;color:#7d8896;margin-top:1px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid #33414f;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;transition:.15s}
.chk.on{background:#3ddc97;border-color:#3ddc97;color:#08150f;font-weight:700}
.chk:active{transform:scale(.9)}
.task{font-size:15px;line-height:1.75}
.task .brk{display:block;height:6px}
.flag{margin-top:10px;font-size:12.5px;color:#9fb0c0;background:#111922;border-left:3px solid #2f5570;
  padding:8px 10px;border-radius:0 8px 8px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tips{font-size:12.5px;color:#ffb020;background:#241a08;border:1px solid #4a3410;border-radius:10px;padding:9px 11px;margin-bottom:12px}
.tips.red{color:#ff8080;background:#2a1010;border-color:#4a1c1c}
.tips.blue{color:#8ec5ff;background:#0d1a28;border-color:#1e3a5c}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;
  padding:11px 15px;font-size:14px;font-weight:600;background:#22303d;color:#dbe6f0;cursor:pointer;min-height:44px}
.btn:active{opacity:.75}
.btn.pri{background:linear-gradient(135deg,#2f9e6d,#3ddc97);color:#06140e}
.btn.blue{background:linear-gradient(135deg,#2b6cb0,#4a9eff);color:#03111f}
.btn.ghost{background:transparent;border:1px solid #2a3644;color:#9fb0c0}
.btn.block{display:flex;width:100%}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-row .btn{flex:1}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hm{aspect-ratio:1/1;min-height:11px;border-radius:4px;background:#1a222c;position:relative}
.hm.done{background:#3ddc97}
.hm.half{background:#2b6a52}
.hm.miss{background:#3a2020}
.hm.today{outline:2px solid #4a9eff;outline-offset:1px}
.hm.off{background:transparent}
.legend{display:flex;gap:12px;font-size:11px;color:#7d8896;margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:middle}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi .k{background:#0f151c;border:1px solid #1f2a36;border-radius:12px;padding:14px}
.kpi .k b{display:block;font-size:22px;color:#e6edf3;line-height:1.2}
.kpi .k span{font-size:11.5px;color:#7d8896}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:#111820;
  border-top:1px solid #1e2733;padding-bottom:env(safe-area-inset-bottom);z-index:30}
.tabbar a{flex:1;text-align:center;padding:9px 0 7px;font-size:10.5px;color:#6c7a88;text-decoration:none}
.tabbar a .ico{display:block;font-size:19px;line-height:1.25}
.tabbar a.on{color:#3ddc97}
textarea,input:not([type]),input[type=text],input[type=date],input[type=password],select{width:100%;background:#0f151c;color:#e6edf3;
  border:1px solid #253140;border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;outline:none}
textarea{min-height:78px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:#3ddc97}
.block-item{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #1a222c;font-size:13.5px}
.block-item:last-child{border-bottom:0}
.block-item .x{color:#6c7a88;padding:2px 6px;flex:0 0 auto}
.block-item .bt{flex:1;word-break:break-word}
.small{font-size:12px;color:#7d8896;line-height:1.75}
.mt8{margin-top:8px}.mt12{margin-top:12px}
.empty{text-align:center;color:#5f6b78;font-size:13px;padding:18px 0}
.card.cp{position:relative;padding-left:16px;margin-bottom:0}
.card.cp::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:#2b3a4a}
.card.cp.pass::before{background:#3ddc97}
.card.cp.fail::before{background:#ff6b6b}
.card.cp h3{margin:0;font-size:14.5px}
.card.cp .d{font-size:12px;color:#7d8896;margin:2px 0 6px}
.card.cp .fix{font-size:12.5px;color:#9fb0c0;margin-top:6px}
.auth{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 80% at 50% 0%,#13202b 0%,#0b0f14 60%);
  display:flex;align-items:center;justify-content:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
.auth.hide{display:none}
.authbox{width:100%;max-width:380px}
.authbox .logo{width:52px;height:52px;border-radius:15px;background:#12301f;color:#3ddc97;display:flex;
  align-items:center;justify-content:center;font-size:26px;margin-bottom:14px;border:1px solid #1e4d33}
.authbox h1{font-size:21px;margin:0 0 4px;letter-spacing:.3px}
.authbox .sub{font-size:12.5px;color:#7d8896;margin:0 0 22px}
.auth-tabs{display:flex;gap:6px;background:#0f151c;border:1px solid #1e2733;border-radius:11px;padding:4px;margin-bottom:14px}
.auth-tabs button{flex:1;border:0;background:transparent;color:#7d8896;font-size:13.5px;padding:9px 0;border-radius:8px;
  font-family:inherit;cursor:pointer}
.auth-tabs button.on{background:#1d2a36;color:#e6edf3}
.auth input{display:block;margin-bottom:10px;height:46px;width:100%}
.hide{display:none!important}
.auth .err{color:#ff8080;font-size:12.5px;min-height:18px;margin:2px 0 8px}
.auth .hint{font-size:11.5px;color:#5f6b78;margin-top:14px;line-height:1.7}
.auth .hint input{height:38px;margin-top:6px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#22303d;color:#e6edf3;padding:9px 16px;border-radius:99px;font-size:13px;z-index:99;
  opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center}
.toast.on{opacity:1}
.q{font-size:14.5px;line-height:1.7;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid #253140;border-radius:10px;
  margin-bottom:8px;font-size:14px;cursor:pointer}
.opt:active{background:#1b242e}
.opt .oi{width:20px;height:20px;border-radius:50%;border:1.5px solid #33414f;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#7d8896}
.opt.sel{border-color:#4a9eff;background:#0f1d2c}
.opt.right{border-color:#3ddc97;background:#0f2119}
.opt.wrong{border-color:#ff6b6b;background:#241212}
.opt .oi.right{background:#3ddc97;color:#06140e;border-color:#3ddc97}
.opt .oi.wrong{background:#ff6b6b;color:#2a0c0c;border-color:#ff6b6b}
.expl{font-size:12.5px;color:#9fb0c0;background:#111922;border-radius:9px;padding:9px 11px;margin-top:2px}
.syncbar{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#7d8896}
.dot{width:7px;height:7px;border-radius:50%;background:#5f6b78;flex:0 0 auto}
.dot.on{background:#3ddc97}
.dot.err{background:#ff6b6b}
.pc-only{display:none}
@media (min-width:960px){
  .hdr{padding-left:calc((100% - 960px)/2 + 18px);padding-right:calc((100% - 960px)/2 + 18px)}
  .pc-only{display:block}
  .ph-only{display:none}
  body{font-size:15.5px}
  .kpi{grid-template-columns:repeat(4,1fr)}
  #view.cp{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  #view.cp>.card{margin-bottom:0}
  #view.me{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  #view.me>.card{margin-bottom:0}
  .cpi,.w2{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="auth hide" id="auth">
  <div class="authbox">
    <div class="logo">◎</div>
    <h1>Agent 学习监督</h1>
    <p class="sub">8 个月 · 195 天 · 每天一段代码 + 3 道题</p>
    <div class="auth-tabs">
      <button id="tabLogin" class="on" onclick="authMode('login')">登录</button>
      <button id="tabReg" onclick="authMode('reg')">注册新账号</button>
    </div>
    <input id="au" type="text" placeholder="用户名" autocomplete="username" autocapitalize="off">
    <input id="ap" type="password" placeholder="密码" autocomplete="current-password">
    <input id="ap2" type="password" placeholder="再输一次密码" class="hide" autocomplete="new-password">
    <div class="err" id="autherr"></div>
    <button class="btn pri block" id="authbtn" onclick="doAuth()">登录</button>
    <button class="btn ghost block mt8" onclick="offlineMode()">先离线用（数据只存这台电脑）</button>
    <div class="hint">服务器地址（本机就是 127.0.0.1）<input id="asrv" type="text" placeholder="http://127.0.0.1:8790"></div>
  </div>
</div>
<div class="hdr" id="hdr"></div>
<main id="view"></main>
<nav class="tabbar" id="tabbar">
  <a href="#today" data-t="today"><span class="ico">◎</span>今天</a>
  <a href="#quiz" data-t="quiz"><span class="ico">✎</span>答题</a>
  <a href="#prog" data-t="prog"><span class="ico">▦</span>进度</a>
  <a href="#cp" data-t="cp"><span class="ico">⚑</span>检查点</a>
  <a href="#me" data-t="me"><span class="ico">⋯</span>我的</a>
</nav>
<div class="toast" id="toast"></div>

/* ================= 存储 ================= */
function loadJSON(k){ try{ return JSON.parse(localStorage.getItem(k))||{} }catch(e){ return {} } }
function saveJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true }catch(e){ toast('存储失败'); return false } }

var S=loadJSON(KEY);
if(!S.startDate) S.startDate='2026-10-27';
if(!S.goal) S.goal=120;
if(!S.logs) S.logs={};
if(!S.cp) S.cp={};
if(!S.fin) S.fin={};
if(!S.quiz) S.quiz={};
if(!S.setAt) S.setAt=Date.now();
function save(){ S.setAt=S.setAt||Date.now(); saveJSON(KEY,S); }

var SY=loadJSON(SYKEY);
if(!SY.url) SY.url='';
if(!SY.user) SY.user='';
if(!SY.token) SY.token='';

if(!SY.last) SY.last=0;
if(SY.auto===undefined) SY.auto=true;

/* ================= 日期 ================= */
function pd(s){ var p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function ymd(d){ var m=d.getMonth()+1,dd=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }
function addD(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function todayD(){ var n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function fmtCN(d){ return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function diffD(a,b){ return Math.round((a.getTime()-b.getTime())/86400000); }
var START=pd(S.startDate);
function idxOfDate(dt){ return diffD(dt,START); }
function dateOfIdx(i){ return addD(START,i); }
function todayIdx(){ return idxOfDate(todayD()); }

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtTask(t){
  var s=String(t==null?'':t).replace(/<br\s*\/?>/gi,'\n');
  s=esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<span class="brk"></span>');
  return s;
}
function shortText(t,n){
  var s=String(t||'').replace(/<br\s*\/?>/gi,' ').replace(/`/g,'').replace(/\s+/g,' ');
  return s.length>n?s.slice(0,n)+'…':s;
}
function el(id){ return document.getElementById(id); }
var toastTimer=null;
function toast(m){ var t=el('toast'); t.textContent=m; t.className='toast on';
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.className='toast'; },1900); }

/* ================= 记录 ================= */
function logOf(k){ if(!S.logs[k]) S.logs[k]={done:{},minutes:0,blocks:[],note:'',hash:'',at:0}; return S.logs[k]; }
function isDone(lg){ return !!(lg&&lg.done&&lg.done.warm&&lg.done.main&&lg.done.note&&lg.done.commit); }
function doneCount(lg){ if(!lg||!lg.done) return 0; var c=0; var ks=['warm','main','note','commit'];
  for(var i=0;i<ks.length;i++){ if(lg.done[ks[i]]) c++; } return c; }
function touch(lg){ lg.at=Date.now(); S.setAt=Date.now(); }

function streak(){
  var t=todayIdx(); var start=t;
  if(t<0) return 0;
  if(t>=DAYS.length) start=DAYS.length-1;
  var lgT=S.logs[ymd(dateOfIdx(t))];
  if(!isDone(lgT)) start=t-1;
  var n=0;
  for(var i=start;i>=0;i--){ if(isDone(S.logs[ymd(dateOfIdx(i))])) n++; else break; }
  return n;
}
function bestStreak(){
  var best=0,cur=0;
  for(var i=0;i<DAYS.length;i++){
    if(isDone(S.logs[ymd(dateOfIdx(i))])){ cur++; if(cur>best) best=cur; } else cur=0;
  }
  return best;
}

/* ================= 同步 ================= */
var pushTimer=null, syncing=false;
function apiBase(){ var u=(SY.url||'').trim().replace(/\/+$/,''); return u; }
function api(path,method,body){
  var url=apiBase()+path;
  var opts={method:method||'GET',headers:{'Content-Type':'application/json'}};
  if(SY.token) opts.headers['Authorization']='Bearer '+SY.token;
  if(body) opts.body=JSON.stringify(body);
  return fetch(url,opts).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if(!r.ok){ var msg=j.error||('HTTP '+r.status); var err=new Error(msg); err.status=r.status; throw err; }
      return j;
    });
  });
}
function syncSetStatus(txt,cls){
  var n=el('syncdot'); if(n) n.className='dot '+(cls||'');
  var s=el('synstate') || el('syntxt'); if(s) s.textContent=txt;
}
function authCall(path,payload){
  if(!apiBase()){ return Promise.reject(new Error('服务地址没填')); }
  return api(path,'POST',payload).then(function(j){
    // 换账号时清掉本机旧数据，避免串号
    if(SY.user && j.username && SY.user!==j.username){
      S={startDate:S.startDate,goal:S.goal,setAt:Date.now(),logs:{},cp:{},fin:{},quiz:{}};
    }
    SY.token=j.token; SY.user=j.username; SY.rev=j.rev; SY.last=Date.now(); saveSY();
    var empty=true;
    if(j.state){
      for(var k in j.state){ if(k!=='startDate'&&k!=='goal'&&k!=='setAt'){ empty=false; break; } }
    }
    if(empty){
      // 服务端还没有数据：把本机进度推上去
      adoptRemote(S);
      syncPush();
    } else {
      adoptRemote(j.state);
    }
    return j;
  });
}
function authLogin(name,pwd){ return authCall('/api/login',{username:name,password:pwd}); }
function authRegister(name,pwd){ return authCall('/api/register',{username:name,password:pwd}); }
function adoptRemote(remote){
  if(!remote) return;
  var merged=deepMerge(S,remote);
  S=merged;
  if(!S.logs) S.logs={}; if(!S.cp) S.cp={}; if(!S.fin) S.fin={}; if(!S.quiz) S.quiz={};
  saveJSON(KEY,S);
  renderHdr(); go(TAB);
}
function atOf(o){ if(!o||typeof o!=='object') return 0; return +o.at||0; }
function deepMerge(a,b){
  var out={};
  for(var k in a) out[k]=a[k];
  for(var k2 in b) out[k2]=b[k2];
  ['logs','cp','fin','quiz'].forEach(function(f){
    var x=a[f]||{}, y=b[f]||{}, m={};
    var keys={}; for(var kk in x) keys[kk]=1; for(var kk2 in y) keys[kk2]=1;
    for(var kk3 in keys){
      var p=x[kk3], q=y[kk3];
      if(p===undefined){ m[kk3]=q; }
      else if(q===undefined){ m[kk3]=p; }
      else if(typeof p==='object'&&typeof q==='object'&&p&&q&&(p.at!==undefined||q.at!==undefined)){
        m[kk3]=atOf(q)>=atOf(p)?q:p;
      } else if(typeof p==='object'&&typeof q==='object'&&p&&q){
        var sub={}; var sks={};
        for(var s1 in p) sks[s1]=1; for(var s2 in q) sks[s2]=1;
        for(var s3 in sks){
          var u=p[s3],v=q[s3];
          if(u===undefined) sub[s3]=v; else if(v===undefined) sub[s3]=u;
          else sub[s3]=atOf(v)>=atOf(u)?v:u;
        }
        m[kk3]=sub;
      } else { m[kk3]=q; }
    }
    out[f]=m;
  });
  out.startDate = (S.setAt||0) >= (b.setAt||0) ? a.startDate : b.startDate;
  out.goal = (S.setAt||0) >= (b.setAt||0) ? a.goal : b.goal;
  out.setAt = Math.max(a.setAt||0,b.setAt||0);
  return out;
}
function syncPush(){
  if(!SY.token||!apiBase()) return Promise.resolve(false);
  if(syncing) return Promise.resolve(false);
  syncing=true;
  syncSetStatus('同步中…','');
  return api('/api/state','POST',{state:S,rev:SY.rev}).then(function(j){
    SY.rev=j.rev; SY.last=Date.now(); saveSY();
    adoptRemote(j.state);
    syncSetStatus('已同步','on');
    syncing=false; return true;
  }).catch(function(e){
    syncing=false;
    if(e && e.status===401){ authExpired(); return false; }
    syncSetStatus('同步失败，稍后重试','err'); return false;
  });
}
function authExpired(){
  SY.token=''; SY.rev=0; saveSY();
  syncSetStatus('登录已失效','err');
  renderHdr();
  toast('登录已失效，请重新登录');
  showAuth();
}
function syncPull(){
  if(!SY.token||!apiBase()) return Promise.resolve(false);
  return api('/api/state','GET').then(function(j){
    SY.rev=j.rev; SY.last=Date.now(); saveSY();
    adoptRemote(j.state);
    syncSetStatus('已同步','on');
    return true;
  }).catch(function(){ syncSetStatus('离线','err'); return false; });
}
function schedulePush(){
  if(!SY.token||!apiBase()) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(function(){ syncPush(); },1200);
}
function fmtAgo(t){ if(!t) return '从未';
  var d=Math.floor((Date.now()-t)/1000);
  if(d<60) return d+' 秒前';
  if(d<3600) return Math.floor(d/60)+' 分钟前';
  return Math.floor(d/3600)+' 小时前';
}

/* ================= 顶部 ================= */
function renderHdr(){
  var t=todayIdx(), h='';
  if(t<0){
    h='<div class="hdr-row"><h1>还没开始</h1><span class="badge">W0 待启动</span></div>'+
      '<div class="sub">计划从 '+S.startDate+' 开始</div>';
  } else if(t>=DAYS.length){
    h='<div class="hdr-row"><h1>计划已结束</h1><span class="badge ok">D'+DAYS.length+'</span></div>'+
      '<div class="sub">'+S.startDate+' 起已满 '+(t+1)+' 天</div>';
  } else {
    var d=DAYS[t], lg=S.logs[ymd(todayD())], st=streak();
    h='<div class="hdr-row"><h1>'+d.id+' · '+PHASES[d.phase]+'</h1>'+
      (isDone(lg)?'<span class="badge ok">今日已完成</span>':'<span class="badge warn">待打卡</span>')+
      (SY.token?'<span class="badge dim">已同步</span>':'<span class="badge dim">本机</span>')+
      '</div>'+
      '<div class="sub">'+ymd(todayD())+' '+DOW[todayD().getDay()]+' · 第 '+(t+1)+' / '+DAYS.length+' 天'+
      (st>0?' · 连续 '+st+' 天':'')+'</div>';
  }
  el('hdr').innerHTML=h;
}

    '<button class="btn block mt8" onclick="addBlock()">记一条卡点</button>';
  if(lg.blocks&&lg.blocks.length){

    }
  } else { html+='<div class="empty">还没有记录。卡住超过 20 分钟就该写一条。</div>'; }
  html+='</div>';

  html+='<div class="card"><h2>明天 / 后天</h2>';
  for(var j=1;j<=2;j++){
    var nx=DAYS[t+j]; if(!nx) break;

/* ================= 答题 ================= */
function todayQuiz(){
  var t=todayIdx(); if(t<0||t>=DAYS.length) return [];
  var ph=DAYS[t].phase, pool=BANK[ph]||BANK.M1, out=[];
  for(var k=0;k<3;k++){
    var idx=(t*3+k)%pool.length;
    out.push({qid:ph+'_'+idx, ph:ph, item:pool[idx]});
  }
  return out;
}
function qrec(date,qid){ if(!S.quiz[date]) S.quiz[date]={}; return S.quiz[date][qid]; }
function quizDoneCount(date){ if(!S.quiz[date]) return 0; return Object.keys(S.quiz[date]).length; }
function quizScore(date){ var n=0; if(!S.quiz[date]) return 0;
  for(var k in S.quiz[date]){ if(S.quiz[date][k].ok) n++; } return n; }

function renderQuiz(){
  var t=todayIdx();
  if(t<0||t>=DAYS.length){ el('view').innerHTML='<div class="card"><div class="empty">计划未开始或已结束。</div></div>'; return; }
  var k=ymd(todayD()), qs=todayQuiz(), d=DAYS[t];
  var done=quizDoneCount(k);
  var html='<div class="card"><h2>'+d.id+' · '+d.phase+' 阶段 · '+fmtCN(todayD())+'</h2>'+
    '<div class="small">已答 '+done+'/3 · 答对 '+quizScore(k)+' 题'+(done>=3?' · 今天完成了':'')+'</div>'+
    '<div class="bar mt8"><i style="width:'+Math.round(done/3*100)+'%"></i></div></div>';

  for(var i=0;i<qs.length;i++){
    var q=qs[i], rec=qrec(k,q.qid);
    html+='<div class="card"><div class="q"><b>'+(i+1)+'.</b> '+esc(q.item.q)+'</div>';
    if(rec){
      for(var j=0;j<q.item.a.length;j++){
        var cls='opt';
        if(j===q.item.k) cls+=' right';
        else if(rec.pick===j) cls+=' wrong';
        html+='<div class="'+cls+'"><span class="oi '+(j===q.item.k?'right':(rec.pick===j?'wrong':''))+'">'+
          String.fromCharCode(65+j)+'</span><span>'+esc(q.item.a[j])+'</span></div>';
      }
      html+='<div class="expl"><b>'+(rec.ok?'答对':'答错')+'：</b>'+esc(q.item.e)+'</div>';
    } else {
      for(var j2=0;j2<q.item.a.length;j2++){
        html+='<div class="opt" onclick="answer(\''+q.qid+'\','+j2+')">'+
          '<span class="oi">'+String.fromCharCode(65+j2)+'</span><span>'+esc(q.item.a[j2])+'</span></div>';
      }
    }
    html+='</div>';
  }
  html+='<div class="card"><h2>规则</h2><div class="small">每天 3 题，按当天所处阶段出题（阶段推进，题目就换）。<br>'+
    '答完立刻给解释；答案存在本机，登录同步后电脑端也能看到。<br>'+
    '答对不等于学会——真正的验收在「检查点」那 4 天。</div></div>';
  el('view').innerHTML=html;
}
function answer(qid,pick){
  var k=ymd(todayD()), qs=todayQuiz(), item=null;
  for(var i=0;i<qs.length;i++){ if(qs[i].qid===qid) item=qs[i].item; }
  if(!item) return;
  if(!S.quiz[k]) S.quiz[k]={};
  S.quiz[k][qid]={ok:pick===item.k?1:0,pick:pick,at:Date.now()};
  S.setAt=Date.now();
  save(); schedulePush(); renderQuiz();
  var done=quizDoneCount(k);
  if(done>=3) toast('今日 3 题完成，答对 '+quizScore(k)+' 题');
}

/* ================= 进度 ================= */
function renderProg(){
  var t=todayIdx(), passed=Math.max(0,Math.min(DAYS.length,t+1)), doneN=0,minutes=0,blocks=0,qn=0,qok=0;
  for(var i=0;i<DAYS.length;i++){

  html+='<div class="card"><h2>数字</h2><div class="kpi">'+
    '<div class="k"><b>'+streak()+'</b><span>当前连续（天）</span></div>'+

    html+='<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px">'+
      '<span>'+ph+' · '+PHASES[ph]+'</span><span class="small">'+dn+'/'+tot+'</span></div>'+

    cells+='<div class="'+cls+'" onclick="jumpDay('+i3+')"></div>';
  }
  html+=cells+'</div>';
  html+='<div class="legend"><span><i style="background:#3ddc97"></i>完成</span>'+
    '<span><i style="background:#2b6a52"></i>部分</span><span><i style="background:#3a2020"></i>漏了</span>'+
    '<span><i style="background:#1a222c"></i>未到</span></div>';

  html+='<div class="card mt12"><h2>补记 / 查看某天</h2>'+
    '<input type="date" id="jd" value="'+ymd(todayD())+'">'+
    '<button class="btn block mt8" onclick="jumpByDate()">打开这一天</button></div>';
  el('view').innerHTML=html;
}
function jumpDay(i){

/* ---------- 登录 ---------- */
var AUTH_MODE='login';
function showAuth(){
  var a=el('auth'); if(!a) return;
  a.className='auth';
  if(el('asrv')) el('asrv').value = SY.url || defaultServer();
  if(el('au')) el('au').value = SY.user || '';
  if(el('ap')) el('ap').value='';
  if(el('ap2')) el('ap2').value='';
  authMode('login');
  setTimeout(function(){ if(el('ap')) el('ap').focus(); },120);
}
function hideAuth(){ var a=el('auth'); if(a) a.className='auth hide'; }
function defaultServer(){
  if(location.protocol==='http:'||location.protocol==='https:') return location.origin;
  return 'http://127.0.0.1:8790';
}
function authMode(m){
  AUTH_MODE=m;
  if(el('tabLogin')) el('tabLogin').className = m==='login'?'on':'';
  if(el('tabReg')) el('tabReg').className = m==='reg'?'on':'';
  if(el('ap2')) el('ap2').className = m==='reg'?'':'hide';
  if(el('authbtn')) el('authbtn').textContent = m==='reg'?'注册并登录':'登录';
  if(el('autherr')) el('autherr').textContent='';
}
function authErr(m){ if(el('autherr')) el('autherr').textContent=m||''; }
function doAuth(){
  var u=(el('au').value||'').trim();
  var p=(el('ap').value||'');
  var p2=(el('ap2').value||'');
  var srv=(el('asrv')&&el('asrv').value||'').trim().replace(/\/+$/,'');
  authErr('');
  if(!u){ authErr('请输入用户名'); return; }
  if(!p){ authErr('请输入密码'); return; }
  if(AUTH_MODE==='reg'){
    if(p.length<6){ authErr('密码至少 6 位'); return; }
    if(p!==p2){ authErr('两次输入的密码不一样'); return; }
  }
  if(srv) { SY.url=srv; saveSY(); }
  var btn=el('authbtn'); if(btn){ btn.disabled=true; btn.textContent=AUTH_MODE==='reg'?'注册中…':'登录中…'; }
  var p1 = AUTH_MODE==='reg' ? authRegister(u,p) : authLogin(u,p);
  p1.then(function(j){
    hideAuth();
    renderAll();
    toast((AUTH_MODE==='reg'?'注册成功，已登录：':'欢迎回来，')+j.username);
  }).catch(function(e){
    authErr(e.message||'连接失败，检查服务是否在跑');
  }).then(function(){
    if(btn){ btn.disabled=false; btn.textContent=AUTH_MODE==='reg'?'注册并登录':'登录'; }
  });
}
function offlineMode(){ hideAuth(); renderAll(); toast('离线模式：数据只存在这台电脑'); }
var logoutArm=false;
function doLogout(){
  if(!logoutArm){
    logoutArm=true;
    var b=el('logoutbtn'); if(b) b.textContent='再点一次确认退出';
    setTimeout(function(){ logoutArm=false; var b2=el('logoutbtn'); if(b2) b2.textContent='退出登录'; },5000);
    return;
  }
  logoutArm=false;
  SY.token=''; SY.user=''; SY.rev=0; saveSY();
  S={startDate:S.startDate,goal:S.goal,setAt:Date.now(),logs:{},cp:{},fin:{},quiz:{}};
  saveJSON(KEY,S);
  renderAll(); showAuth();
  toast('已退出，本机进度已清空');
}
function doSync(){ if(!SY.token){ showAuth(); return; } syncPush().then(function(){ renderMe(); toast('同步完成'); }); }

    if(j.enabled&&j.url){ location.href=j.url; } else { toast('服务端未配置微信登录'); }
  }).catch(function(){ toast('连不上服务'); });

function saveStart(){ var v=el('sd').value; if(!v) return; S.startDate=v; S.setAt=Date.now(); save(); schedulePush(); renderAll(); toast('起始日期已保存'); }
function setReminderNative(){

function toggleFin(i){ var cur=S.fin[i]&&S.fin[i].v; S.fin[i]={v:cur?0:1,at:Date.now()}; S.setAt=Date.now(); save(); schedulePush(); renderMe(); }
function exportData(){ el('io').value=JSON.stringify(S); toast('已生成，点复制保存到别处'); }
function copyIO(){
  var ta=el('io'); if(!ta.value){ toast('先导出'); return; }
  ta.select();
  try{ document.execCommand('copy'); toast('已复制'); }catch(e){ toast('长按文本手动复制'); }
}
function importData(){
  var v=el('io').value; if(!v){ toast('先粘贴 JSON'); return; }
  try{
    var o=JSON.parse(v);
    if(!o||typeof o!=='object') throw new Error('bad');
    S=o;
    if(!S.startDate) S.startDate='2026-10-27';
    if(!S.goal) S.goal=120;
    if(!S.logs) S.logs={}; if(!S.cp) S.cp={}; if(!S.fin) S.fin={}; if(!S.quiz) S.quiz={};
    S.setAt=Date.now();
    save(); schedulePush(); renderAll(); toast('导入成功');
  }catch(e){ toast('JSON 不合法'); }
}
var resetArm=false;
function resetAll(){
  if(!resetArm){
    resetArm=true; toast('再点一次确认清空');
    setTimeout(function(){ resetArm=false; },5000);
    return;
  }
  resetArm=false;
  S.logs={}; S.cp={}; S.fin={}; S.quiz={}; S.setAt=Date.now();
  save(); schedulePush(); renderAll(); toast('已清空');
}

/* ================= 路由 ================= */
var TAB='today';
function go(t){
  TAB=t;
  var v=el('view'); if(v) v.className=t;
  var links=document.querySelectorAll('#tabbar a');
  for(var i=0;i<links.length;i++){ links[i].className=links[i].getAttribute('data-t')===t?'on':''; }
  if(t==='today') renderToday();
  else if(t==='quiz') renderQuiz();
  else if(t==='prog') renderProg();
  else if(t==='cp') renderCp();
  else renderMe();
  window.scrollTo(0,0);
}
function renderAll(){ renderHdr(); go(TAB); }

document.getElementById('tabbar').addEventListener('click',function(e){
  var a=e.target.closest?e.target.closest('a'):null;
  if(a){ e.preventDefault(); go(a.getAttribute('data-t')); }
});
window.addEventListener('hashchange',function(){
  var h=location.hash.replace('#','');
  if(h&&h!==TAB) go(h);
});

/* 启动 */
(function(){
  var h=location.hash.replace('#','');
  if(h&&['today','quiz','prog','cp','me'].indexOf(h)>=0) TAB=h;

  // 微信回调带回的 token
  var qs=location.search||'';
  var mt=qs.match(/token=([^&]+)/), mu=qs.match(/user=([^&]+)/);
  if(mt){
    SY.token=decodeURIComponent(mt[1]);
    if(mu) SY.user=decodeURIComponent(mu[1]);
    saveSY(); toast('微信登录成功');
  }

  renderHdr(); go(TAB);

  if(SY.token && SY.url){
    hideAuth();
    syncPush();
  } else if(SY.token && !SY.url){
    SY.url = defaultServer(); saveSY();
    hideAuth(); syncPush();
  } else {
    showAuth();
  }

  // 自动同步
  setInterval(function(){
    if(SY.token&&SY.auto&&apiBase()){ syncPush(); }
  },60000);

  // 跨天刷新
  var dayKey=ymd(todayD());
  setInterval(function(){
    if(ymd(todayD())!==dayKey){ dayKey=ymd(todayD()); renderAll(); }
  },60000);
})();
</script>
</body>
